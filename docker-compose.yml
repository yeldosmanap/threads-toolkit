# Threads Toolkit web service: site + API + job queue + scraper worker + S3 storage.
#
#   cp .env.example .env      # change the secrets
#   docker compose up --build
#   open http://localhost:3000
#
# The worker uses the Threads session from ./.auth/threads-storageState.json (create it with `npm run login`).
# Without it, searches run logged-out and return only ~15-20 posts.

name: threads-toolkit

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: threads
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threads}
      POSTGRES_DB: threads
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:55432:5432" # 55432: avoid clashing with a locally installed Postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threads -d threads"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # S3-compatible storage (SeaweedFS) - the official MinIO Docker images are no longer published.
  # In production point the S3_* settings at any real S3 (AWS, Yandex, R2, ...) instead.
  s3:
    image: chrislusf/seaweedfs:3.85
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"backend","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed server -dir=/data -ip.bind=0.0.0.0 -volume.max=0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-threads-s3}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-threads-s3-secret}
    volumes:
      - s3data:/data
    # Not published: the bucket is private, files are downloaded through the backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://threads:${POSTGRES_PASSWORD:-threads}@postgres:5432/threads?sslmode=disable
      WORKER_TOKEN: ${WORKER_TOKEN:-dev-worker-token-change-me}
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: threads-exports
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-threads-s3}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-threads-s3-secret}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      QUOTA_ACTIVE_JOBS: ${QUOTA_ACTIVE_JOBS:-3}
      QUOTA_DAILY_JOBS: ${QUOTA_DAILY_JOBS:-20}
      MAX_ITEMS_LIMIT: ${MAX_ITEMS_LIMIT:-500}
    ports:
      - "127.0.0.1:8080:8080" # for local development (vite dev server proxies here)
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    restart: unless-stopped

  worker:
    # Same scraper code as the Apify Actor, packaged on the official multi-arch Playwright image
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      BACKEND_URL: http://backend:8080
      WORKER_TOKEN: ${WORKER_TOKEN:-dev-worker-token-change-me}
      THREADS_STORAGE_STATE_PATH: /run/threads/threads-storageState.json
      PROXY_URLS: ${PROXY_URLS:-}
      CRAWLEE_STORAGE_DIR: /tmp/crawlee
    volumes:
      - ./.auth:/run/threads:ro
    shm_size: 1gb # Chromium needs more shared memory than Docker's 64 MB default
    depends_on:
      - backend
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  s3data:
